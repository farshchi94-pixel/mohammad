name: optimize

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: signal-hub/requirements.txt
      - name: Install Python dependencies
        run: pip install -r signal-hub/requirements.txt
      - name: Run optimizer
        working-directory: signal-hub
        run: python optimize.py
      - name: Publish report to the site root
        run: test -f signal-hub/optimize.json && cp signal-hub/optimize.json optimize.json || true
      - name: Validate optimization report
        working-directory: signal-hub
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("optimize.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(data, dict) and isinstance(data.get("updated"), (int, float))
          print(json.dumps({"event": "optimization_report", "status": "ok", "updated": data["updated"]}))
          PY
      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Signal Hub optimization"
            echo "- Run: \\`${GITHUB_RUN_ID}\\`"
            echo "- Commit: \\`${GITHUB_SHA:0:12}\\`"
            echo "- Runbook: [scan-failure](../../blob/main/docs/runbooks/scan-failure.md)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload optimization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-hub-optimization-${{ github.run_id }}
          path: |
            signal-hub/optimize.json
            optimize.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save report
        if: success()
        run: |
          git config user.name "signal-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git config pull.rebase true
          git add optimize.json signal-hub/optimize.json || true
          git diff --cached --quiet || (git commit -m "chore: update optimization report" && git pull --rebase && git push)
