name: scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: signal-hub/requirements.txt
      - name: Install Python dependencies
        run: pip install -r signal-hub/requirements.txt
      - name: Run scanner
        working-directory: signal-hub
        run: python scan.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          RUN_ID: ${{ github.run_id }}
      - name: Validate output files
        working-directory: signal-hub
        run: python validate_outputs.py
      - name: Publish data to the site root
        run: |
          for f in signals.json whales.json whalepro.json candles.json market.json competitors.json consensus.json dex_consensus.json paper.json; do
            test -f "signal-hub/$f" && cp "signal-hub/$f" "$f" || true
          done
      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Signal Hub scan"
            echo "- Run: \\`${GITHUB_RUN_ID}\\`"
            echo "- Commit: \\`${GITHUB_SHA:0:12}\\`"
            echo "- Runbook: [scan-failure](../../blob/main/docs/runbooks/scan-failure.md)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-hub-scan-${{ github.run_id }}
          path: |
            signal-hub/*.json
            *.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save results
        if: success()
        run: |
          git config user.name "signal-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git config pull.rebase true
          git add signals.json whales.json whalepro.json candles.json market.json competitors.json consensus.json dex_consensus.json paper.json signal-hub/*.json || true
          git diff --cached --quiet || (git commit -m "chore: update market data" && git pull --rebase && git push)
